
{% extends "base.html" %}

{% block title %}Submit Shift Report | OpsRelay{% endblock %}

{% block content %}

<div class="page-heading">
    <h1>Submit Shift Report</h1>
    <p>Record important operational information for the next shift.</p>
</div>

<div class="card report-form">

    <form id="shiftReportForm">

        <h3>Employee Information</h3>

        <div class="form-group">
            <label for="employee">Employee Name</label>
            <input type="text" id="employee" name="employee"
                   placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="shift">Shift</label>
            <select id="shift" name="shift" required>
                <option value="">Select your shift</option>
                <option>Morning Shift</option>
                <option>Evening Shift</option>
                <option>Night Shift</option>
            </select>
        </div>

        <hr>

        <h3 style="margin: 22px 0;">Machine Information</h3>

        <div class="form-group">
            <label for="machine">Machine Name / ID</label>
            <input type="text" id="machine" name="machine"
                   placeholder="Example: Machine A" required>
        </div>

        <div class="form-group">
            <label for="issue">Problem Observed</label>
            <textarea id="issue" name="issue"
                      placeholder="Describe the problem observed..."
                      required></textarea>
        </div>

        <div class="form-group">
            <label for="action">Action Taken</label>
            <textarea id="action" name="action"
                      placeholder="What steps did you take?"
                      required></textarea>
        </div>

        <div class="form-group">
            <label for="status">Issue Status</label>
            <select id="status" name="status" required>
                <option value="">Select issue status</option>
                <option value="Resolved">Resolved</option>
                <option value="Pending">Pending</option>
                <option value="Monitoring">Monitoring</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Additional Notes (Optional)</label>
            <textarea id="notes" name="notes"
                      placeholder="Add anything the next shift should know..."></textarea>
        </div>

        <button type="submit" class="btn">
            Submit Shift Report
        </button>

        <p id="reportMessage" style="margin-top: 15px;"></p>

    </form>

</div>

{% endblock %}
